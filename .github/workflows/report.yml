name: WildFly Dependency Upgrades

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: dependency-upgrades

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Generate reports
        run: curl -Ls https://sh.jbang.dev | bash -s - Report.java
      - name: Deploy to GitHub Pages
        if: github.repository_owner == 'rhusar' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: target/site
          commit-message: Dependency upgrades report
